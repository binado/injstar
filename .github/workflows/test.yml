name: test

on:
  push:
    branches: [main]
    paths: ["**.py", "pyproject.toml", "uv.lock", ".github/workflows/test.yml"]
  pull_request:
    branches: [main]
    paths: ["**.py", "pyproject.toml", "uv.lock", ".github/workflows/test.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
          version: "0.12.18"
      - name: Install the project
        run: uv sync --locked --all-groups
      - name: Check the lockfile
        run: uv lock --check
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check
      - name: Build distributions
        run: uv build

  test:
    name: Python ${{ matrix.python-version }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:

        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.12.18"
      - name: Install the project
        run: uv sync --locked --all-groups
      # BAYESTAR tests are slow and version-independent, so only the newest Python runs them.
      - name: Run tests
        run: uv run pytest -n auto ${{ matrix.python-version != '3.14' && '-m "not slow"' || '' }}
